[project]
name = "fastapi-async-task-outbox-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 默认运行即打印任务状态流水与判定依据（各测试通过 dump_flow 输出）
addopts = "-s"
log_level = "INFO"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
